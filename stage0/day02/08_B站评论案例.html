<!DOCTYPE html>
<!--
  使用说明：
  1. 安装 json-server：npm install -g json-server
  2. 启动接口服务：json-server --watch db.json --port 3001
  3. 打开本 HTML 文件，页面会自动从 http://localhost:3001/comments 获取评论数据
  
  优化要点：
  ✅ 使用 axios 发送 AJAX 请求获取评论列表
  ✅ 使用 useEffect 在组件挂载后调用接口
  ✅ 把评论项抽象成独立组件实现渲染
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>08_B站评论案例（接口版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    
    /* 头部 */
    .header { display: flex; align-items: center; margin-bottom: 20px; }
    .header h2 { font-size: 20px; margin-right: 10px; }
    .header .count { color: #999; font-size: 14px; }
    
    /* Tab 导航 */
    .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .tab { cursor: pointer; color: #666; font-size: 14px; padding: 5px 0; }
    .tab.active { color: #00a1d6; border-bottom: 2px solid #00a1d6; }
    
    /* 输入框区域 */
    .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-area img { width: 40px; height: 40px; border-radius: 50%; }
    .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: #f5f5f5; }
    .input-area button { padding: 10px 20px; background: #00a1d6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .input-area button:hover { background: #008bc7; }
    .input-area button:disabled { background: #ccc; cursor: not-allowed; }
    
    /* 评论列表 */
    .comment { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
    .comment img { width: 40px; height: 40px; border-radius: 50%; }
    .comment-content { flex: 1; }
    .comment-author { color: #666; font-size: 14px; margin-bottom: 5px; }
    .comment-text { color: #333; font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
    .comment-meta { display: flex; gap: 15px; font-size: 12px; color: #999; }
    .comment-meta span { cursor: pointer; }
    .comment-meta span:hover { color: #00a1d6; }
    .delete-btn { color: #999; }
    .delete-btn:hover { color: #ff4d4f; }
    .like-btn { color: #999; }
    .like-btn.liked { color: #00a1d6; }
    
    /* 空状态 */
    .empty { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios@1.6.0/dist/axios.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React

    /* ── 评论项组件（Item 组件）── */
    function CommentItem({ item, onDelete, onLike }) {
      return (
        <div className="comment">
          <img src={item.avatar} alt={item.author} />
          <div className="comment-content">
            <div className="comment-author">{item.author}</div>
            <div className="comment-text">{item.text}</div>
            <div className="comment-meta">
              <span>{item.time}</span>
              <span 
                className={`like-btn ${item.isLiked ? 'liked' : ''}`}
                onClick={() => onLike(item.id)}
              >
                {item.isLiked ? '已点赞' : '点赞'}:{item.likes}
              </span>
              {/* 只有自己的评论才显示删除按钮 */}
              {item.author === '我' && (
                <span 
                  className="delete-btn"
                  onClick={() => onDelete(item.id)}
                >
                  删除
                </span>
              )}
            </div>
          </div>
        </div>
      )
    }

    function App() {
      // 1. 评论列表状态
      const [comments, setComments] = useState([])
      
      // 2. 输入框内容状态
      const [inputValue, setInputValue] = useState('')
      
      // 3. 当前选中的 Tab（最新/最热）
      const [activeTab, setActiveTab] = useState('latest')

      // 4. 使用 useEffect 调用接口获取评论列表
      useEffect(() => {
        // 发送网络请求获取评论数据
        axios.get('http://localhost:3001/comments')
          .then(res => {
            setComments(res.data)
          })
          .catch(err => {
            console.error('获取评论失败:', err)
            // 如果接口失败，使用模拟数据
            setComments([
              { id: 1, author: 'jack', text: '这是一条评论回复', time: '2023-11-11', likes: 100, isLiked: false, avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=jack' },
              { id: 2, author: '张三', text: '讲得真好，学习了！', time: '2023-11-10', likes: 50, isLiked: false, avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=zhang' },
            ])
          })
      }, [])  // 空数组 = 只在首次渲染后执行一次

      // 5. 发布评论 - POST 请求
      const handlePublish = () => {
        if (!inputValue.trim()) return
        
        const newComment = {
          author: '我',
          text: inputValue,
          time: new Date().toISOString().slice(0, 10),
          likes: 0,
          isLiked: false,
          avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=me'
        }
        
        // 发送 POST 请求添加评论
        axios.post('http://localhost:3001/comments', newComment)
          .then(res => {
            // 新评论加到最前面
            setComments([res.data, ...comments])
            setInputValue('')
          })
          .catch(err => {
            console.error('发布评论失败:', err)
          })
      }

      // 6. 删除评论 - DELETE 请求
      const handleDelete = (id) => {
        // 发送 DELETE 请求
        axios.delete(`http://localhost:3001/comments/${id}`)
          .then(() => {
            // 删除成功后更新前端状态
            setComments(comments.filter(item => item.id !== id))
          })
          .catch(err => {
            console.error('删除评论失败:', err)
          })
      }

      // 7. 点赞/取消点赞 - PATCH 请求
      const handleLike = (id) => {
        const comment = comments.find(item => item.id === id)
        const updatedComment = {
          ...comment,
          isLiked: !comment.isLiked,
          likes: comment.isLiked ? comment.likes - 1 : comment.likes + 1
        }
        
        // 发送 PATCH 请求更新评论
        axios.patch(`http://localhost:3001/comments/${id}`, updatedComment)
          .then(() => {
            // 更新成功后更新前端状态
            setComments(comments.map(item => 
              item.id === id ? updatedComment : item
            ))
          })
          .catch(err => {
            console.error('点赞失败:', err)
          })
      }

      // 8. 根据 Tab 排序评论
      const sortedComments = [...comments].sort((a, b) => {
        if (activeTab === 'latest') {
          // 最新：按时间倒序
          return new Date(b.time) - new Date(a.time)
        } else {
          // 最热：按点赞数倒序
          return b.likes - a.likes
        }
      })

      return (
        <div className="container">
          {/* 头部 */}
          <div className="header">
            <h2>评论</h2>
            <span className="count">{comments.length}</span>
          </div>

          {/* Tab 导航 */}
          <div className="tabs">
            <span 
              className={`tab ${activeTab === 'latest' ? 'active' : ''}`}
              onClick={() => setActiveTab('latest')}
            >
              最新
            </span>
            <span 
              className={`tab ${activeTab === 'hot' ? 'active' : ''}`}
              onClick={() => setActiveTab('hot')}
            >
              最热
            </span>
          </div>

          {/* 输入框区域 */}
          <div className="input-area">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=me" alt="avatar" />
            <input 
              type="text" 
              placeholder="发一条友善的评论"
              value={inputValue}
              onChange={(e) => setInputValue(e.target.value)}
              onKeyPress={(e) => e.key === 'Enter' && handlePublish()}
            />
            <button 
              onClick={handlePublish}
              disabled={!inputValue.trim()}
            >
              发布
            </button>
          </div>

          {/* 评论列表 - 使用 CommentItem 组件渲染 */}
          {sortedComments.length === 0 ? (
            <div className="empty">暂无评论，来发表第一条吧！</div>
          ) : (
            sortedComments.map(item => (
              <CommentItem 
                key={item.id}
                item={item}
                onDelete={handleDelete}
                onLike={handleLike}
              />
            ))
          )}
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App />)
  </script>
</body>
</html>
