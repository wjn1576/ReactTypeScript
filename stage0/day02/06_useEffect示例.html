<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>06_useEffect示例</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .section-title {
      font-size: 16px; font-weight: bold; color: #333;
      margin: 28px 0 12px; padding-left: 10px;
      border-left: 4px solid #00a1d6;
    }
    .card {
      background: white; border-radius: 10px;
      padding: 20px; margin-bottom: 16px; border: 2px solid #eee;
    }
    .card h3 { margin: 0 0 12px; font-size: 15px; color: #333; }
    .code-hint {
      background: #f5f5f5; border-radius: 6px;
      padding: 12px 16px; font-family: Consolas, monospace;
      font-size: 12px; color: #555; margin-top: 10px;
    }
    .display-box {
      background: #f9f9f9; border: 1px dashed #ccc;
      border-radius: 6px; padding: 12px 16px;
      font-size: 14px; color: #555;
    }
    .display-box strong { color: #00a1d6; }
    button {
      padding: 8px 18px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px; margin: 5px 5px 0 0;
    }
    .btn-primary { background: #00a1d6; color: white; }
    .btn-primary:hover { background: #008bc7; }
    .btn-gray { background: #eee; color: #555; }
    .btn-gray:hover { background: #ddd; }
    .tag {
      display: inline-block; padding: 2px 10px;
      border-radius: 10px; font-size: 12px; margin-left: 6px;
    }
    .tag-blue { background: #e3f2fd; color: #1565c0; }
    .tag-green { background: #e8f5e9; color: #2e7d32; }
    .tag-orange { background: #fff3e0; color: #e65100; }
    .log-box {
      background: #1e1e1e; color: #d4d4d4; border-radius: 6px;
      padding: 12px 16px; font-family: Consolas, monospace;
      font-size: 12px; margin-top: 10px; min-height: 50px;
      max-height: 150px; overflow-y: auto;
    }
    .log-box .log-item { padding: 2px 0; border-bottom: 1px solid #333; }
    .log-box .log-item:last-child { border-bottom: none; }
    .green { color: #4ec9b0; }
    .yellow { color: #dcdcaa; }
    .blue { color: #9cdcfe; }
    .loading { color: #aaa; font-style: italic; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #e3f2fd; color: #1565c0; padding: 8px 12px; text-align: left; }
    td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React

    /* ── 模拟假数据（替代真实 AJAX）── */
    const fakeArticles = [
      { id: 1, title: 'React useEffect 入门', author: '张三', views: 1024 },
      { id: 2, title: 'useState vs useRef 区别', author: '李四', views: 856 },
      { id: 3, title: '父子组件通信完全指南', author: '王五', views: 2048 },
    ]

    function App() {
      /* ── 示例一：无依赖项，仅首次渲染执行 ── */
      const [articles, setArticles] = useState([])
      const [loading, setLoading] = useState(true)
      const [logs1, setLogs1] = useState([])

      useEffect(() => {
        // 模拟 AJAX 请求（1秒后返回数据）
        addLog1('组件渲染完毕，开始请求数据...')
        const timer = setTimeout(() => {
          setArticles(fakeArticles)
          setLoading(false)
          addLog1('数据返回，更新 state，页面重新渲染')
        }, 1000)
        return () => clearTimeout(timer)
      }, [])   // [] 空数组 = 只在首次渲染后执行一次

      const addLog1 = (msg) => setLogs1(prev => [...prev, { id: Date.now(), msg }])

      /* ── 示例二：有依赖项，依赖变化时执行 ── */
      const [count, setCount] = useState(0)
      const [title, setTitle] = useState('初始标题')
      const [logs2, setLogs2] = useState([])

      useEffect(() => {
        // count 变化时，同步修改网页标题
        document.title = `count = ${count}`
        setLogs2(prev => [...prev, { id: Date.now(), msg: `count 变为 ${count}，已同步网页标题` }])
      }, [count])  // count 变化时执行

      /* ── 示例三：无依赖项数组，每次渲染都执行 ── */
      const [renderCount, setRenderCount] = useState(0)
      const [logs3, setLogs3] = useState(['组件初始化'])

      useEffect(() => {
        // 没有第二个参数 = 每次渲染后都执行
        setRenderCount(prev => prev + 1)
      })  // 注意：没有第二个参数

      return (
        <div className="container">
          <h1>06_useEffect 示例</h1>
          <p className="subtitle">用于处理"由渲染本身引起的操作"，如发送 AJAX 请求、修改 DOM 等</p>

          {/* 核心概念 */}
          <div className="card" style={{ background: '#fff8e1', borderColor: '#ffe082' }}>
            <h3>⚡ 核心概念：useEffect 不是你调用的，是 React 自动执行的</h3>
            <div style={{ fontSize: '14px', color: '#555', lineHeight: '1.8' }}>
              <div style={{ marginBottom: '12px' }}>
                你写 <code>useEffect</code>，相当于在<strong>登记一个任务给 React</strong>：
                <span style={{ color: '#e65100', fontWeight: 'bold' }}>"等页面渲染完，帮我执行这个函数"</span>
              </div>
              <div className="code-hint" style={{ background: '#fff3cd' }}>
                {`// React 内部执行流程：\n1. 执行 App()  →  收集 useEffect（登记下来）\n2. 把页面渲染到浏览器（DOM 更新完成）\n3. 渲染完成后  →  React 自动执行 useEffect 里的函数`}
              </div>
              <div style={{ marginTop: '14px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                <div style={{ background: '#ffebee', padding: '12px', borderRadius: '6px' }}>
                  <div style={{ color: '#c62828', fontWeight: 'bold', marginBottom: '6px' }}>❌ 错误理解</div>
                  <div>"我调用了这个函数，它就执行了"</div>
                </div>
                <div style={{ background: '#e8f5e9', padding: '12px', borderRadius: '6px' }}>
                  <div style={{ color: '#2e7d32', fontWeight: 'bold', marginBottom: '6px' }}>✅ 正确理解</div>
                  <div>"我注册了一个任务，React 在合适时机帮我执行"</div>
                </div>
              </div>
            </div>
          </div>

          {/* 为什么叫 Hook */}
          <div className="card" style={{ background: '#f3e5f5', borderColor: '#ce93d8' }}>
            <h3>🪝 为什么叫 Hook（钩子）？</h3>
            <div style={{ fontSize: '14px', color: '#555', lineHeight: '2' }}>
              <div>Hook = <strong>挂钩在 React 生命周期上的函数</strong></div>
              <div>你把一段逻辑"钩"在某个时机上，React 到了那个时机自动触发</div>
              <div className="code-hint" style={{ background: '#ede7f6', marginTop: '8px' }}>
                {`useEffect(() => { ... }, [])      // 钩在：首次渲染后\nuseEffect(() => { ... }, [count]) // 钩在：count 变化后\nuseEffect(() => { ... })          // 钩在：每次渲染后`}
              </div>
            </div>
          </div>

          {/* 什么时候用 */}
          <div className="card" style={{ background: '#f0f8ff', borderColor: '#90caf9' }}>
            <h3>💡 什么时候用 useEffect？</h3>
            <div style={{ fontSize: '14px', lineHeight: '2', color: '#555' }}>
              <div>• <strong>事件触发</strong>（点击、输入）→ 用事件处理函数，<strong>不需要 useEffect</strong></div>
              <div>• <strong>渲染完成后</strong>自动执行某操作 → 用 <strong>useEffect</strong></div>
              <div style={{ marginTop: '6px', color: '#888' }}>
                例如：页面加载后发请求、count 变化后同步标题、组件销毁后清除定时器
              </div>
            </div>
          </div>

          {/* 示例一 */}
          <div className="section-title">① useEffect + AJAX <span className="tag tag-blue">依赖项 = []</span></div>
          <div className="card">
            <h3>页面加载后自动请求文章列表</h3>
            <div className="code-hint">
              {`useEffect(() => {\n  fetch('/api/articles')\n    .then(res => res.json())\n    .then(data => setArticles(data))\n}, [])  // [] = 只在首次渲染后执行一次`}
            </div>
            <div style={{ marginTop: '12px' }}>
              {loading ? (
                <div className="display-box loading">⏳ 请求中，1秒后返回数据...</div>
              ) : (
                <table>
                  <thead>
                    <tr><th>标题</th><th>作者</th><th>浏览量</th></tr>
                  </thead>
                  <tbody>
                    {articles.map(a => (
                      <tr key={a.id}>
                        <td>{a.title}</td>
                        <td>{a.author}</td>
                        <td>{a.views}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
            <div className="log-box">
              {logs1.map(l => <div key={l.id} className="log-item"><span className="green">▶</span> {l.msg}</div>)}
            </div>
          </div>

          {/* 示例二 */}
          <div className="section-title">② useEffect 监听依赖变化 <span className="tag tag-green">依赖项 = [count]</span></div>
          <div className="card">
            <h3>count 变化时，自动同步网页标签页标题</h3>
            <div className="code-hint">
              {`useEffect(() => {\n  document.title = \`count = \${count}\`\n}, [count])  // count 变化时执行`}
            </div>
            <div className="display-box" style={{ marginTop: '12px' }}>
              当前 count：<strong>{count}</strong>
              &nbsp;（看浏览器标签页标题会同步变化）
            </div>
            <div style={{ marginTop: '10px' }}>
              <button className="btn-primary" onClick={() => setCount(c => c + 1)}>count + 1</button>
              <button className="btn-gray" onClick={() => setCount(0)}>重置</button>
            </div>
            <div className="log-box">
              {logs2.map(l => <div key={l.id} className="log-item"><span className="yellow">▶</span> {l.msg}</div>)}
            </div>
          </div>

          {/* 为什么 useEffect 执行两次 */}
          <div className="section-title">④ 为什么 useEffect 会执行两次？<span className="tag tag-orange">开发模式特性</span></div>
          <div className="card" style={{ background: '#fff8e1', borderColor: '#ffe082' }}>
            <h3>⚠️ React 严格模式（StrictMode）会故意执行两次</h3>
            <div style={{ fontSize: '14px', color: '#555', lineHeight: '1.8' }}>
              <div style={{ marginBottom: '12px' }}>
                你写 <code>useEffect(() ={'>'} {'{}'}, [])</code> 预期只执行一次，但看到控制台打印了两次？
              </div>
              <div className="code-hint" style={{ background: '#fff3cd' }}>
                {`// React 开发模式下的流程（StrictMode）\n1. 组件首次渲染\n2. 执行 useEffect（第 1 次）\n3. React 故意卸载组件（模拟）\n4. React 重新挂载组件\n5. 再次执行 useEffect（第 2 次）\n// 生产环境（build 后）不会这样`}
              </div>
              <div style={{ marginTop: '12px' }}>
                <strong>为什么 React 要这样做？</strong>
              </div>
              <ul style={{ margin: '8px 0', paddingLeft: '20px', color: '#666' }}>
                <li>检测你的组件是否<strong>清理了副作用</strong>（比如定时器没 clear 就会暴露问题）</li>
                <li>测试你的组件是否<strong>能正确重置状态</strong></li>
                <li>帮助你发现潜在的<strong>内存泄漏</strong></li>
              </ul>
              <div style={{ marginTop: '12px', background: '#e8f5e9', padding: '12px', borderRadius: '6px', fontSize: '13px' }}>
                <strong style={{ color: '#2e7d32' }}>✅ 正确写法能通过严格模式：</strong>
                <div className="code-hint" style={{ background: '#c8e6c9', marginTop: '8px' }}>
                  {`useEffect(() => {\n  console.log('启动定时器')\n  const timer = setInterval(() => {}, 1000)\n\n  return () => {\n    console.log('清理定时器')  // ← 严格模式会触发这个\n    clearInterval(timer)       // ← 正确清理就能通过测试\n  }\n}, [])`}
                </div>
              </div>
              <div style={{ marginTop: '12px', color: '#888', fontSize: '13px' }}>
                💡 记忆口诀：<strong>谁创建，谁清理</strong> —— 这样写生产环境没问题，开发模式也不怕双执行。
              </div>
            </div>
          </div>

          {/* 三种写法对比 */}
          <div className="section-title">③ 三种写法对比</div>
          <div className="card">
            <table>
              <thead>
                <tr><th>写法</th><th>执行时机</th><th>典型用途</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td><code>useEffect(() =&gt; {'{}'})</code></td>
                  <td>每次渲染后都执行</td>
                  <td>记录每次渲染日志</td>
                </tr>
                <tr>
                  <td><code>useEffect(() =&gt; {'{}'}, [])</code></td>
                  <td>只在首次渲染后执行一次</td>
                  <td>发 AJAX 请求、自动聚焦</td>
                </tr>
                <tr>
                  <td><code>useEffect(() =&gt; {'{}'}, [val])</code></td>
                  <td>val 变化时执行</td>
                  <td>监听 count 变化、搜索联动</td>
                </tr>
              </tbody>
            </table>
            <div className="code-hint" style={{ marginTop: '12px' }}>
              {`// 清除副作用（组件销毁时执行 return 里的函数）\nuseEffect(() => {\n  const timer = setInterval(() => {}, 1000)\n  return () => clearInterval(timer)  // 清除定时器\n}, [])`}
            </div>
          </div>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App />)
  </script>
</body>
</html>
