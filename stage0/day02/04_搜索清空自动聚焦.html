<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>04_搜索清空自动聚焦</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
    h1 { color: #333; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }

    /* 搜索框区域 */
    .search-box {
      display: flex;
      align-items: center;
      border: 2px solid #ddd;
      border-radius: 24px;
      padding: 8px 16px;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .search-box:focus-within {
      border-color: #00a1d6;  /* 聚焦时边框变蓝 */
    }
    .search-icon { color: #aaa; font-size: 16px; }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      background: transparent;
    }
    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 18px;
      line-height: 1;
      padding: 0 4px;
      border-radius: 50%;
    }
    .clear-btn:hover { color: #666; background: #f0f0f0; }

    /* 搜索结果 */
    .result-list { margin-top: 20px; }
    .result-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      color: #333;
    }
    .result-item:hover { background: #f5f5f5; }
    .result-item em {
      color: #00a1d6;
      font-style: normal;
      font-weight: bold;
    }
    .empty { color: #aaa; text-align: center; padding: 30px; font-size: 14px; }

    /* 操作按钮区 */
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button.action-btn {
      padding: 8px 18px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 13px;
      color: #555;
    }
    button.action-btn:hover { background: #f5f5f5; }
    button.action-btn.primary { background: #00a1d6; color: white; border-color: #00a1d6; }
    button.action-btn.primary:hover { background: #008bc7; }

    /* 说明面板 */
    .info { margin-top: 25px; padding: 16px; background: #f0f8ff; border-radius: 8px; font-size: 13px; color: #555; }
    .info h4 { color: #00a1d6; margin: 0 0 10px 0; }
    .info ul { margin: 0; padding-left: 20px; line-height: 2; }
    .tag { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 1px 8px; border-radius: 10px; font-size: 12px; margin-left: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React

    const DATA = [
      'React 受控表单绑定',
      'React useRef 获取DOM',
      'React useState 基础用法',
      'React useEffect 副作用',
      'React 组件通信 props',
      'React 列表渲染 key',
      'React 条件渲染',
      'Vue3 组合式 API',
      'JavaScript 闭包',
      'TypeScript 基础类型',
    ]

    function App() {
      // ① 受控绑定：搜索关键词
      const [keyword, setKeyword] = useState('')

      // ② useRef：拿到输入框 DOM，用于手动聚焦
      const inputRef = useRef(null)

      // ③ useEffect：页面加载后自动聚焦
      useEffect(() => {
        inputRef.current.focus()
      }, [])

      // 根据关键词过滤列表
      const results = keyword.trim()
        ? DATA.filter(item => item.toLowerCase().includes(keyword.toLowerCase()))
        : []

      // 清空搜索框并重新聚焦
      const handleClear = () => {
        setKeyword('')              // 受控绑定：清空 state → 输入框自动变空
        inputRef.current.focus()   // useRef：清空后重新聚焦
      }

      // 点击结果项填入搜索框
      const handleSelect = (item) => {
        setKeyword(item)
        inputRef.current.focus()
      }

      // 高亮关键词
      const highlight = (text) => {
        const idx = text.toLowerCase().indexOf(keyword.toLowerCase())
        if (idx === -1) return text
        return (
          <>
            {text.slice(0, idx)}
            <em>{text.slice(idx, idx + keyword.length)}</em>
            {text.slice(idx + keyword.length)}
          </>
        )
      }

      return (
        <div className="container">
          <h1>04_搜索 · 清空 · 自动聚焦</h1>
          <p className="subtitle">综合演示：受控绑定 + useRef + useEffect</p>

          {/* 搜索框 */}
          <div className="search-box">
            <span className="search-icon">🔍</span>
            <input
              ref={inputRef}
              className="search-input"
              type="text"
              placeholder="搜索 React / JS 知识点..."
              value={keyword}
              onChange={(e) => setKeyword(e.target.value)}
            />
            {/* 有内容时才显示清空按钮 */}
            {keyword && (
              <button className="clear-btn" onClick={handleClear} title="清空">✕</button>
            )}
          </div>

          {/* 操作按钮 */}
          <div className="actions">
            <button className="action-btn primary" onClick={() => inputRef.current.focus()}>
              重新聚焦
            </button>
            <button className="action-btn" onClick={handleClear}>
              清空内容
            </button>
          </div>

          {/* 搜索结果 */}
          <div className="result-list">
            {keyword.trim() === '' ? (
              <div className="empty">输入关键词开始搜索</div>
            ) : results.length === 0 ? (
              <div className="empty">没有找到 "{keyword}" 相关内容</div>
            ) : (
              results.map((item, i) => (
                <div key={i} className="result-item" onClick={() => handleSelect(item)}>
                  🔍 {highlight(item)}
                </div>
              ))
            )}
          </div>

          {/* 知识点说明 */}
          <div className="info">
            <h4>本例用到的知识点</h4>
            <ul>
              <li>
                <strong>自动聚焦</strong><span className="tag">useRef + useEffect</span>
                &nbsp;— 页面加载后执行 <code>inputRef.current.focus()</code>
              </li>
              <li>
                <strong>清空并聚焦</strong><span className="tag">useState + useRef</span>
                &nbsp;— <code>setKeyword('')</code> 清空，再 <code>focus()</code> 激活
              </li>
              <li>
                <strong>实时过滤</strong><span className="tag">useState</span>
                &nbsp;— keyword 变化 → 重新计算 results → 自动渲染
              </li>
              <li>
                <strong>条件显示清空按钮</strong><span className="tag">条件渲染</span>
                &nbsp;— <code>{`{keyword && <button>✕</button>}`}</code>
              </li>
            </ul>
          </div>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App />)
  </script>
</body>
</html>
