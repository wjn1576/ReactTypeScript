<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>10_useState基础</title>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React  // 引入 useState

    function App() {
      /*
        useState 语法：
        const [状态变量, 修改函数] = useState(初始值)
        
        这里的 count 是状态值，setCount 是用来修改它的函数
      */
      const [count, setCount] = useState(0)

      // 1. 加法
      const add = () => {
        setCount(count + 1)  // 调用 setCount 修改值
        console.log('点击后 count =', count + 1)
      }

      // 2. 减法
      const minus = () => {
        setCount(count - 1)
      }

      return (
        <div style={{padding: '20px'}}>
          <h1>useState 计数器示例</h1>
          
          {/* 显示当前状态值 */}
          <p style={{fontSize: '48px', color: 'blue'}}>{count}</p>
          
          {/* 按钮修改状态 */}
          <button onClick={add} style={{marginRight: '10px'}}>
            +1
          </button>
          <button onClick={minus}>
            -1
          </button>

          <hr style={{margin: '20px 0'}} />

          {/* 更复杂的例子：输入框 */}
          <InputDemo />

          {/* 对象状态修改示例 */}
          <FormDemo />
        </div>
      )
    }

    // 另一个例子：表单输入
    function InputDemo() {
      const [name, setName] = useState('')  // 初始值空字符串

      return (
        <div>
          <h2>表单输入示例</h2>
          <input 
            type="text" 
            placeholder="请输入名字"
            value={name}
            onChange={(e) => setName(e.target.value)}
            style={{padding: '8px'}}
          />
          <p>你输入的是：{name}</p>
        </div>
      )
    }

    /*
      对象状态修改示例：
      - 不能直接修改原对象（form.name = 'xxx' ❌）
      - 必须用展开运算符创建新对象（{...form, name: 'xxx'} ✅）
    */
    function FormDemo() {
      // 初始状态是一个对象
      const [form, setForm] = useState({
        name: '张三',
        age: 18
      })

      // 修改名字：展开原对象，只覆盖 name 属性
      const changeName = () => {
        setForm({
          ...form,           // 展开运算符：复制 form 所有属性
          name: '李四'       // 覆盖 name 属性为新值
        })
      }

      // 修改年龄：展开原对象，只覆盖 age 属性
      const changeAge = () => {
        setForm({
          ...form,           // 先复制原来的所有属性
          age: form.age + 1   // 再覆盖 age 属性
        })
      }

      return (
        <div style={{marginTop: '20px', padding: '20px', backgroundColor: '#f5f5f5'}}>
          <h2>对象状态修改示例（展开运算符 ...）</h2>
          <p>姓名：{form.name}，年龄：{form.age}</p>
          <button onClick={changeName} style={{marginRight: '10px'}}>
            改名（展开原对象 + 覆盖 name）
          </button>
          <button onClick={changeAge}>
            年龄+1（展开原对象 + 覆盖 age）
          </button>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App />)
  </script>
</body>
</html>
