<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>01_Redux基础概念</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .section-title {
      font-size: 16px; font-weight: bold; color: #333;
      margin: 28px 0 12px; padding-left: 10px;
      border-left: 4px solid #764abc;
    }
    .card {
      background: white; border-radius: 10px;
      padding: 20px; margin-bottom: 16px; border: 2px solid #eee;
    }
    .card h3 { margin: 0 0 12px; font-size: 15px; color: #333; }
    .concept-box {
      background: #f8f5ff; border: 1px solid #d4c5f9;
      border-radius: 6px; padding: 16px; margin: 12px 0;
    }
    .concept-box h4 { margin: 0 0 8px; color: #764abc; font-size: 14px; }
    .flow-diagram {
      background: #fff; border: 2px solid #764abc;
      border-radius: 8px; padding: 20px; margin: 16px 0;
      text-align: center; font-family: monospace;
    }
    .flow-step {
      background: #f0ebff; border: 1px solid #764abc;
      border-radius: 4px; padding: 8px 12px;
      margin: 8px auto; display: inline-block;
      font-size: 13px; color: #333;
    }
    .arrow { color: #764abc; font-size: 20px; margin: 5px 0; }
    .code-box {
      background: #282c34; color: #abb2bf;
      border-radius: 6px; padding: 16px;
      font-family: 'Consolas', monospace; font-size: 13px;
      overflow-x: auto; margin: 12px 0;
    }
    .code-box .keyword { color: #c678dd; }
    .code-box .function { color: #61afef; }
    .code-box .string { color: #98c379; }
    .code-box .comment { color: #5c6370; }
    .comparison {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 12px 0;
    }
    .comparison > div {
      background: #f9f9f9; border: 1px solid #ddd;
      border-radius: 6px; padding: 12px;
    }
    .comparison h4 { margin: 0 0 8px; font-size: 14px; }
    .tag {
      display: inline-block; padding: 2px 10px;
      border-radius: 10px; font-size: 12px; margin-left: 6px;
    }
    .tag-purple { background: #f0ebff; color: #764abc; }
    .demo-area {
      background: white; border: 2px solid #764abc;
      border-radius: 8px; padding: 20px; margin: 16px 0;
      text-align: center;
    }
    .counter { font-size: 48px; font-weight: bold; color: #764abc; margin: 20px 0; }
    button {
      padding: 10px 24px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 16px; margin: 0 8px;
      font-weight: bold;
    }
    .btn-dec { background: #ff6b6b; color: white; }
    .btn-dec:hover { background: #ee5a52; }
    .btn-inc { background: #764abc; color: white; }
    .btn-inc:hover { background: #653a9b; }
    .log-box {
      background: #f5f5f5; border: 1px solid #ddd;
      border-radius: 4px; padding: 12px; margin-top: 16px;
      max-height: 150px; overflow-y: auto;
      font-family: monospace; font-size: 12px;
    }
    .log-item { padding: 4px 0; color: #555; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/redux@4.2.0/dist/redux.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React

    // 1. 定义 reducer 函数（在组件外部）
    function counterReducer(state = 0, action) {
      switch (action.type) {
        case 'INCREMENT':
          return state + 1
        case 'DECREMENT':
          return state - 1
        default:
          return state
      }
    }

    // 2. 创建 store（在组件外部，全局唯一）
    const store = Redux.createStore(counterReducer)

    function App() {
      const [logs, setLogs] = useState([])

      // 3. 订阅变化
      useEffect(() => {
        const unsubscribe = store.subscribe(() => {
          const newLog = `状态更新: ${store.getState()}`
          setLogs(prev => [newLog, ...prev].slice(0, 10))
        })
        return unsubscribe
      }, [])

      // 4. dispatch 方法
      const handleIncrement = () => {
        store.dispatch({ type: 'INCREMENT' })
      }

      const handleDecrement = () => {
        store.dispatch({ type: 'DECREMENT' })
      }

      // 5. 强制更新以显示 count
      const [, forceUpdate] = useState({})
      useEffect(() => {
        const unsubscribe = store.subscribe(() => {
          forceUpdate({})
        })
        return unsubscribe
      }, [])

      return (
        <div className="container">
          <h1>01_Redux基础概念</h1>
          <p className="subtitle">Redux = 独立的状态管理库，不依赖任何框架</p>

          {/* 什么是 Redux */}
          <div className="card" style={{ background: '#f8f5ff', borderColor: '#d4c5f9' }}>
            <h3>🎯 什么是 Redux？</h3>
            <div style={{ fontSize: '14px', lineHeight: '2', color: '#555' }}>
              <div><strong>定义：</strong>Redux 是 JavaScript 应用的<strong>状态管理库</strong></div>
              <div><strong>特点：</strong>独立于框架，可用于 React、Vue、Angular 或原生 JS</div>
              <div><strong>类比：</strong>Vue 的 Pinia/Vuex，但 Redux 更通用</div>
              <div><strong>核心思想：</strong>把所有状态放在一个全局仓库（Store）里统一管理</div>
            </div>
          </div>

          {/* 为什么需要 Redux */}
          <div className="section-title">① 为什么需要 Redux？</div>
          <div className="card">
            <h3>React 自带状态管理的问题</h3>
            <div className="comparison">
              <div>
                <h4 style={{ color: '#ff6b6b' }}>❌ 没有 Redux</h4>
                <div style={{ fontSize: '13px', color: '#555', lineHeight: '1.8' }}>
                  • 状态分散在各个组件<br/>
                  • props 层层传递（drilling）<br/>
                  • 兄弟组件通信复杂<br/>
                  • 状态逻辑难以复用<br/>
                  • 调试困难
                </div>
              </div>
              <div>
                <h4 style={{ color: '#764abc' }}>✅ 使用 Redux</h4>
                <div style={{ fontSize: '13px', color: '#555', lineHeight: '1.8' }}>
                  • 状态集中管理<br/>
                  • 任何组件直接访问<br/>
                  • 状态变化可追踪<br/>
                  • 逻辑清晰易维护<br/>
                  • 支持时间旅行调试
                </div>
              </div>
            </div>
          </div>

          {/* 核心概念 */}
          <div className="section-title">② Redux 三大核心概念</div>
          <div className="card">
            <div className="concept-box">
              <h4>📦 Store（仓库）</h4>
              <div style={{ fontSize: '13px', color: '#555' }}>
                存储整个应用的状态树，全局唯一。<br/>
                <strong>类比：</strong>银行金库，存放所有人的钱
              </div>
            </div>
            <div className="concept-box">
              <h4>📋 Action（动作）</h4>
              <div style={{ fontSize: '13px', color: '#555' }}>
                描述"发生了什么"的普通对象，必须有 type 属性。<br/>
                <strong>类比：</strong>取款单，写明要做什么操作
              </div>
            </div>
            <div className="concept-box">
              <h4>⚙️ Reducer（处理器）</h4>
              <div style={{ fontSize: '13px', color: '#555' }}>
                纯函数，接收旧状态和 action，返回新状态。<br/>
                <strong>类比：</strong>银行柜员，根据取款单执行操作
              </div>
            </div>
          </div>

          {/* 工作流程 */}
          <div className="section-title">③ Redux 工作流程</div>
          <div className="card">
            <div className="flow-diagram">
              <div className="flow-step">用户操作（点击按钮）</div>
              <div className="arrow">↓</div>
              <div className="flow-step">dispatch(action) - 发起动作</div>
              <div className="arrow">↓</div>
              <div className="flow-step">Reducer 接收 action</div>
              <div className="arrow">↓</div>
              <div className="flow-step">Reducer 返回新的 state</div>
              <div className="arrow">↓</div>
              <div className="flow-step">Store 更新状态</div>
              <div className="arrow">↓</div>
              <div className="flow-step">订阅者收到通知</div>
              <div className="arrow">↓</div>
              <div className="flow-step">UI 重新渲染</div>
            </div>
          </div>

          {/* 代码示例 */}
          <div className="section-title">④ 纯 Redux 代码示例（不依赖 React）</div>
          <div className="card">
            <div className="code-box">
              <div><span className="comment">// 1. 定义 reducer</span></div>
              <div><span className="keyword">function</span> <span className="function">counterReducer</span>(state = <span className="string">0</span>, action) {'{'}</div>
              <div>  <span className="keyword">switch</span> (action.type) {'{'}</div>
              <div>    <span className="keyword">case</span> <span className="string">'INCREMENT'</span>:</div>
              <div>      <span className="keyword">return</span> state + <span className="string">1</span></div>
              <div>    <span className="keyword">case</span> <span className="string">'DECREMENT'</span>:</div>
              <div>      <span className="keyword">return</span> state - <span className="string">1</span></div>
              <div>    <span className="keyword">default</span>:</div>
              <div>      <span className="keyword">return</span> state</div>
              <div>  {'}'}</div>
              <div>{'}'}</div>
              <br/>
              <div><span className="comment">// 2. 创建 store</span></div>
              <div><span className="keyword">const</span> store = Redux.<span className="function">createStore</span>(counterReducer)</div>
              <br/>
              <div><span className="comment">// 3. 订阅变化</span></div>
              <div>store.<span className="function">subscribe</span>(() ={'>'} {'{'})</div>
              <div>  console.<span className="function">log</span>(<span className="string">'状态更新:'</span>, store.<span className="function">getState</span>())</div>
              <div>{'}'})</div>
              <br/>
              <div><span className="comment">// 4. 发起 action</span></div>
              <div>store.<span className="function">dispatch</span>({'{'} type: <span className="string">'INCREMENT'</span> {'}'})</div>
              <div>store.<span className="function">dispatch</span>({'{'} type: <span className="string">'INCREMENT'</span> {'}'})</div>
              <div>store.<span className="function">dispatch</span>({'{'} type: <span className="string">'DECREMENT'</span> {'}'})</div>
              <br/>
              <div><span className="comment">// 5. 获取最新状态</span></div>
              <div>console.<span className="function">log</span>(store.<span className="function">getState</span>())  <span className="comment">// 输出: 1</span></div>
            </div>
          </div>

          {/* 实战演示 */}
          <div className="section-title">⑤ 实战演示：Redux 计数器</div>
          <div className="demo-area">
            <h3 style={{ margin: '0 0 16px', color: '#764abc' }}>Redux 纯计数器</h3>
            <div className="counter">{store.getState()}</div>
            <div>
              <button className="btn-dec" onClick={handleDecrement}>- 减少</button>
              <button className="btn-inc" onClick={handleIncrement}>+ 增加</button>
            </div>
            <div className="log-box">
              <div style={{ fontWeight: 'bold', marginBottom: '8px', color: '#764abc' }}>📋 操作日志：</div>
              {logs.length === 0 ? (
                <div style={{ color: '#999' }}>暂无操作，点击按钮试试</div>
              ) : (
                logs.map((log, index) => (
                  <div key={index} className="log-item">• {log}</div>
                ))
              )}
            </div>
          </div>

          {/* Redux 核心 API */}
          <div className="section-title">⑥ Redux 核心 API</div>
          <div className="card">
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr style={{ background: '#f8f5ff', borderBottom: '2px solid #764abc' }}>
                  <th style={{ padding: '10px', textAlign: 'left' }}>API</th>
                  <th style={{ padding: '10px', textAlign: 'left' }}>作用</th>
                  <th style={{ padding: '10px', textAlign: 'left' }}>示例</th>
                </tr>
              </thead>
              <tbody>
                <tr style={{ borderBottom: '1px solid #eee' }}>
                  <td style={{ padding: '10px' }}><code>createStore(reducer)</code></td>
                  <td style={{ padding: '10px' }}>创建 store 实例</td>
                  <td style={{ padding: '10px', fontSize: '12px' }}><code>const store = createStore(fn)</code></td>
                </tr>
                <tr style={{ borderBottom: '1px solid #eee' }}>
                  <td style={{ padding: '10px' }}><code>store.getState()</code></td>
                  <td style={{ padding: '10px' }}>获取当前状态</td>
                  <td style={{ padding: '10px', fontSize: '12px' }}><code>const count = store.getState()</code></td>
                </tr>
                <tr style={{ borderBottom: '1px solid #eee' }}>
                  <td style={{ padding: '10px' }}><code>store.dispatch(action)</code></td>
                  <td style={{ padding: '10px' }}>发起状态修改</td>
                  <td style={{ padding: '10px', fontSize: '12px' }}><code>store.dispatch({'{'}type: 'ADD'{'}'})</code></td>
                </tr>
                <tr>
                  <td style={{ padding: '10px' }}><code>store.subscribe(fn)</code></td>
                  <td style={{ padding: '10px' }}>订阅状态变化</td>
                  <td style={{ padding: '10px', fontSize: '12px' }}><code>store.subscribe(() => ...)</code></td>
                </tr>
              </tbody>
            </table>
          </div>

          {/* 同步 vs 异步 */}
          <div className="section-title">⑦ 同步操作 vs 异步操作</div>
          <div className="card">
            <h3>同步操作（直接修改状态）</h3>
            <div style={{ fontSize: '13px', color: '#555', lineHeight: '1.8' }}>
              <div style={{ marginBottom: '8px' }}>在 reducers 中定义的方法，调用后<strong>立即修改</strong>状态。</div>
              <div className="code-box">
                <div><span className="comment">// 1. 在 createSlice 中定义同步方法</span></div>
                <div><span className="keyword">reducers</span>: {'{'}</div>
                <div>  <span className="function">inscrement</span>(state) {'{'} state.count++ {'}'},</div>
                <div>  <span className="function">decrement</span>(state) {'{'} state.count-- {'}'},</div>
                <div>  <span className="function">addToNum</span>(state, action) {'{'} state.count = action.<span className="string">payload</span> {'}'}</div>
                <div>{'}'}</div>
                <br/>
                <div><span className="comment">// 2. 组件中直接 dispatch</span></div>
                <div>dispatch(<span className="function">inscrement</span>())      <span className="comment">// count + 1</span></div>
                <div>dispatch(<span className="function">addToNum</span>(<span className="string">10</span>))    <span className="comment">// count = 10（通过 payload 传参）</span></div>
              </div>
            </div>
          </div>

          <div className="card">
            <h3>异步操作（先请求数据，再修改状态）</h3>
            <div style={{ fontSize: '13px', color: '#555', lineHeight: '1.8' }}>
              <div style={{ marginBottom: '8px' }}>需要从接口获取数据时，<strong>不能直接在 reducer 里发请求</strong>，要单独封装异步函数。</div>
              <div className="code-box">
                <div><span className="comment">// 1. createSlice 中只写同步方法（存数据）</span></div>
                <div><span className="keyword">const</span> channelStore = <span className="function">createSlice</span>({'{'}</div>
                <div>  name: <span className="string">'channel'</span>,</div>
                <div>  initialState: {'{'} channelList: [] {'}'},</div>
                <div>  reducers: {'{'}</div>
                <div>    <span className="function">setChannels</span>(state, action) {'{'}</div>
                <div>      state.channelList = action.<span className="string">payload</span></div>
                <div>    {'}'}</div>
                <div>  {'}'}</div>
                <div>{'}'})</div>
                <br/>
                <div><span className="comment">// 2. 单独封装异步函数（请求数据）</span></div>
                <div><span className="keyword">const</span> <span className="function">fetchChannelList</span> = () ={'>'} {'{'}</div>
                <div>  <span className="keyword">return</span> <span className="keyword">async</span> (dispatch) ={'>'} {'{'}</div>
                <div>    <span className="keyword">const</span> res = <span className="keyword">await</span> axios.<span className="function">get</span>(url)</div>
                <div>    dispatch(<span className="function">setChannels</span>(res.data.data.channels))</div>
                <div>  {'}'}</div>
                <div>{'}'}</div>
                <br/>
                <div><span className="comment">// 3. 组件中 dispatch 写法不变</span></div>
                <div><span className="function">useEffect</span>(() ={'>'} {'{'}</div>
                <div>  dispatch(<span className="function">fetchChannelList</span>())</div>
                <div>{'}'}, [dispatch])</div>
              </div>
            </div>
          </div>

          <div className="card">
            <h3>同步 vs 异步 对比</h3>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
              <thead>
                <tr style={{ background: '#f8f5ff', borderBottom: '2px solid #764abc' }}>
                  <th style={{ padding: '10px', textAlign: 'left' }}>对比项</th>
                  <th style={{ padding: '10px', textAlign: 'left' }}>同步操作</th>
                  <th style={{ padding: '10px', textAlign: 'left' }}>异步操作</th>
                </tr>
              </thead>
              <tbody>
                <tr style={{ borderBottom: '1px solid #eee' }}>
                  <td style={{ padding: '10px' }}>定义位置</td>
                  <td style={{ padding: '10px' }}>reducers 内部</td>
                  <td style={{ padding: '10px' }}>单独封装函数</td>
                </tr>
                <tr style={{ borderBottom: '1px solid #eee' }}>
                  <td style={{ padding: '10px' }}>执行时机</td>
                  <td style={{ padding: '10px' }}>立即执行</td>
                  <td style={{ padding: '10px' }}>等待接口返回后执行</td>
                </tr>
                <tr style={{ borderBottom: '1px solid #eee' }}>
                  <td style={{ padding: '10px' }}>使用场景</td>
                  <td style={{ padding: '10px' }}>+1、-1、设置值</td>
                  <td style={{ padding: '10px' }}>请求接口获取数据</td>
                </tr>
                <tr>
                  <td style={{ padding: '10px' }}>组件中调用</td>
                  <td style={{ padding: '10px' }}><code>dispatch(inscrement())</code></td>
                  <td style={{ padding: '10px' }}><code>dispatch(fetchChannelList())</code></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div className="card" style={{ background: '#fff8e1', borderColor: '#ffe082' }}>
            <h3>💡 异步操作流程图</h3>
            <div className="flow-diagram" style={{ borderColor: '#ffa000' }}>
              <div className="flow-step" style={{ background: '#fff3e0' }}>组件 useEffect 触发</div>
              <div className="arrow">↓</div>
              <div className="flow-step" style={{ background: '#fff3e0' }}>dispatch(fetchChannelList())</div>
              <div className="arrow">↓</div>
              <div className="flow-step" style={{ background: '#fff3e0' }}>异步函数内部：await axios.get(url)</div>
              <div className="arrow">↓</div>
              <div className="flow-step" style={{ background: '#fff3e0' }}>拿到数据后：dispatch(setChannels(数据))</div>
              <div className="arrow">↓</div>
              <div className="flow-step" style={{ background: '#fff3e0' }}>reducer 把数据存进 store</div>
              <div className="arrow">↓</div>
              <div className="flow-step" style={{ background: '#fff3e0' }}>组件自动重新渲染</div>
            </div>
          </div>

          {/* 总结 */}
          <div className="card" style={{ background: '#f8f5ff', borderColor: '#d4c5f9' }}>
            <h3>📌 Redux 核心要点</h3>
            <div style={{ fontSize: '14px', lineHeight: '2', color: '#555' }}>
              <div>• <strong>单一数据源</strong>：整个应用的状态存储在一个 store 中</div>
              <div>• <strong>状态只读</strong>：不能直接修改 state，只能通过 dispatch(action)</div>
              <div>• <strong>纯函数更新</strong>：reducer 必须是纯函数，不能有副作用</div>
              <div>• <strong>独立运行</strong>：Redux 不依赖任何框架，可单独使用</div>
              <div>• <strong>可预测</strong>：相同的输入永远得到相同的输出</div>
            </div>
          </div>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App />)
  </script>
</body>
</html>
